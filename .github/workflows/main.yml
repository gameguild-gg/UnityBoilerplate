name: CI/CD

on: [push, pull_request]

# This pipeline has two stages:
#   1. build  — builds the project for WebGL with game-ci's unity-builder
#   2. deploy — publishes the build to GitHub Pages using the official
#               artifact-based deploy (actions/deploy-pages)
#
# The deploy job NEVER pushes a branch. GitHub's Pages service pulls the
# deployment straight from an artifact, so the workflow token does not need
# "Read and write permissions" and no gh-pages branch is created.
#
# Each job declares only the permissions it needs (least privilege).

# Avoid two deploys racing each other when you push twice in a row.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # ------------------------------------------------------------------
  # 1. BUILD — builds the project for WebGL.
  # ------------------------------------------------------------------
  build:
    name: Build for WebGL
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      # NOTE: no Library cache here on purpose. A restored Library makes the
      # editor treat the WebGL build as already up to date, skip the player
      # build, and exit without producing build output (the runner is
      # ephemeral, so the previous build's files are gone) - the build then
      # fails with exit code 137. A full build takes ~10 minutes and is
      # deterministic.
      - name: Build project
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: WebGL
          unityVersion: auto

      # Upload the raw build as an artifact (downloadable from the run page).
      # Path is the build output folder itself, so the artifact root contains
      # index.html and the build files directly.
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Build-WebGL
          path: build/WebGL/WebGL

  # ------------------------------------------------------------------
  # 2. DEPLOY — publishes the build artifact to GitHub Pages.
  #    Only on pushes to the default branch (master or main).
  #    Requires Settings > Pages > Source = "GitHub Actions".
  # ------------------------------------------------------------------
  deploy:
    name: Deploy to GitHub Pages
    needs: build
    if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    permissions:
      pages: write # write to the Pages service
      id-token: write # verify the workflow's identity to Pages
      contents: read
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Download the build produced by the build job (fresh runner, no files yet)
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: Build-WebGL
          path: site

      - name: Configure Pages
        uses: actions/configure-pages@v5

      # Package the site into the special "github-pages" artifact
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      # Hand the artifact to the Pages service — no branch is pushed
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
